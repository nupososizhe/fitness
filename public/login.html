<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Сила и энергия</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/validation.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="login" class="auth">
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="index.html"><img src="images/logo.png" alt="" width="40" height="40">Сила и энергия</a>
      <nav class="nav" aria-label="Основное меню">
      <a href="index.html">Главная</a>
      <a href="application.html" data-auth="user">Заявка</a>
      <a href="cabinet.html" data-auth="user">Мои заявки</a>
      <a href="admin.html" data-auth="admin">Админ-панель</a>
      <a href="login.html" data-auth="guest" aria-current="page">Войти</a>
      <a href="register.html" data-auth="guest">Регистрация</a>
      <a href="#" data-auth="user" id="logout">Выйти</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="panel">
      <h1>Вход</h1>
      <p class="ok-text" id="form-ok" role="status"></p>
      <form id="login-form" novalidate>
      <label class="label" for="login">Логин</label>
      <input class="field" id="login" name="login" type="text" placeholder="" autocomplete="username">
      <div class="error-text" data-error-for="login" role="alert"></div>
      <label class="label" for="password">Пароль</label>
      <input class="field" id="password" name="password" type="password" placeholder="" autocomplete="current-password">
      <div class="error-text" data-error-for="password" role="alert"></div>
        <div class="error-text" id="form-error" role="alert"></div>
        <div class="form-actions"><button class="btn" type="submit">Войти</button></div>
      </form>
      <p class="panel__link">Еще не зарегистрированы? <a href="register.html">Регистрация</a></p>
    </section>
  </main>
</body>
</html>
